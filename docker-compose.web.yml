# docker-compose.web.yml — misfits.ai Mail Frontend
# Déploiement sur HermesWeb VM (Scaleway)
# En production, utiliser docker-compose.deploy.yml du repo reimagined-guide

services:
  web:
    image: rg.fr-par.scw.cloud/smtp-rust-registry/misfits-web:latest
    container_name: misfits-web
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      # Backend email_api HTTP (rewrites are baked at image build time)
      - BACKEND_URL=http://email-api:8000
      # Runtime build labels displayed in footer
      - MISFITS_WEB_BUILD_VERSION=${MISFITS_WEB_BUILD_VERSION:-unknown}
      - REIMAGINED_GUIDE_BUILD_VERSION=${REIMAGINED_GUIDE_BUILD_VERSION:-unknown}
      - NEXT_PUBLIC_MISFITS_WEB_BUILD_VERSION=${NEXT_PUBLIC_MISFITS_WEB_BUILD_VERSION:-unknown}
      - NEXT_PUBLIC_REIMAGINED_GUIDE_BUILD_VERSION=${NEXT_PUBLIC_REIMAGINED_GUIDE_BUILD_VERSION:-unknown}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
