code_review_findings:
  - severity: info
    description: "Protocole v1.0.0 bien structuré: enums typés (TransportState, BusinessState, MessageType), builders make_message/make_result, validate_message complète"
  - severity: info
    description: "Test e2e en 7 étapes claires avec assertions, nettoyage pré et post-test, sortie stdout structurée"
  - severity: info
    description: "Relay v4.1: RPOPLPUSH atomique (garantie non-perte), réconciliation au démarrage, déduplication via msg:done, recovery si crash"
  - severity: info
    description: "Launcher: TaskClaim idempotente (SET NX + Lua pour release/extend), fallback checkpoint fichier si Redis down"
  - severity: info
    description: "Configuration Redis externalisée via variables d'environnement avec fallback sensible"
  - severity: critical
    description: "Credentials Redis codés en dur dans le fichier de test (mot de passe réel exposé dans le dépôt public)"
    files:
      - fleet/tests/test_scenario1_e2e.py:34
    action_required: "Ticket CRITIQUE : migration credentials Redis → variables d'environnement / vault. Rotation immédiate du mot de passe exposé."
  - severity: major
    description: "Assertion tautologique : relay.returncode is not None est toujours True pour subprocess.run (même en cas d'erreur). L'intention était probablement de vérifier returncode == 0."
    files:
      - fleet/tests/test_scenario1_e2e.py:154
    action_required: "Remplacer par `relay.returncode == 0` ou supprimer l'assertion"
  - severity: major
    description: "PR #701 fusionnée 7 secondes après création. Chaîne de validation conductor-ops → PO → Scrum Master → développeur non respectée (gate non fonctionnelle au moment du merge)."
    action_required: "Mettre en place un gate de validation obligatoire (protection branche GitHub) — déjà signalé dans toutes les revues antérieures"
  - severity: minor
    description: "Test e2e nécessite Redis 172.16.12.2 + relay déployé sur /opt/fleet/. Non exécutable en CI standard."
    action_required: "Infrastructure Redis dédiée pour CI ou conteneur de test"
  - severity: minor
    description: "Aucune vérification réelle de l'absence d'effets externes (check codé en dur True)."
    action_required: "Ajouter une vérification post-test (git status clean, pas de nouveaux fichiers trackés)"
  - severity: minor
    description: "Pas de DLQ formelle pour les messages en erreur persistants dans le relay."
    action_required: "Prévoir dans une itération future"

