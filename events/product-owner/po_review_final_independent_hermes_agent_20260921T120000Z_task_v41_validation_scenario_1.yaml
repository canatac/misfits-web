code_review:

  strengths:
    - "Protocole v1.0.0 avec schéma de validation explicite (fleet_protocol.py:115-121)"
    - "RPOPLPUSH atomique corrige le trou v4 de perte de message (fleet_relay_v4_1.py:243)"
    - "Réconciliation au démarrage via reconcile_processing (fleet_relay_v4_1.py:206-224)"
    - "TaskClaim avec SET NX + Lua CAS pour release idempotente (fleet_launcher.py:98-123)"
    - "Launcher utilise --query-file (injection-safe, pas de shell interpolation)"
    - "Logging structuré avec timestamps UTC (fleet_launcher.py:64-73)"
    - "Couverture multi-niveaux : unit, integration, crash recovery, e2e"
    - "Aucune dépendance à tmux — transport purement Redis"
    - "make_result uniformise le format de sortie (state, success, artifacts, duration)"

  observations:
    - severity: MEDIUM
      category: FUNCTIONAL_BUG
      file: "fleet/launcher/fleet_launcher.py:266"
      line: "error_msg = f\"TIMEOUT after {args.run_budget + 30}s\""
      description: |
        NameError : `args` n'est pas dans la portée de `run_task()`. `args` est une variable
        de `main()` (ligne 379). `run_task()` reçoit `msg_run_budget` comme paramètre séparé
        (ligne 216). Si un timeout survient, le launcher crash avec NameError au lieu de
        gérer l'erreur proprement.
      impact: "Le launcher ne peut pas timeout correctement — il crash sur une NameError avant de publier le résultat FAILED."
      recommendation: "Remplacer `args.run_budget` par `msg_run_budget` dans l'exception TimeoutExpired (ligne 266). Ajouter un test unitaire simulant un timeout."

    - severity: MEDIUM
      category: SECURITY
      file: "fleet/tests/test_scenario1_e2e.py:34, fleet/monitoring/fleet_monitor.sh:7, fleet/tests/test_recovery.py:31"
      description: |
        Mot de passe Redis codé en dur (`OTn1WGEUUNsLJDQ3xfokPcxVe75YgtbMdvoPKLzW`)
        dans 3 fichiers sources. Un credential de production est exposé en clair.
      impact: "Rotation immédiate requise. Toute personne avec accès au repo peut accéder à Redis."
      recommendation: |
        - Remplacer les défauts par None (fail-fast si REDIS_PASS manquant)
        - Injection via variables d'environnement uniquement
        - Rotation du credential exposé
        - Ticket séparé pour migration vers secrets manager

    - severity: MEDIUM
      category: TEST_QUALITY
      file: "fleet/tests/test_scenario1_e2e.py:154"
      line: "\"ACCEPTED (relay lancé)\": relay.returncode is not None"
      description: |
        Assertion tautologique : `subprocess.run` retourne un `CompletedProcess` avec
        `returncode` toujours non-None (0, 1, ou code d'erreur). Cette assertion ne
        vérifie PAS que le relay a réussi.
      impact: "Faux positif : le test montre PASS même si le relay échoue (returncode != 0)."
      recommendation: "Remplacer par `relay.returncode == 0` pour vérifier le succès réel."

    - severity: LOW
      category: TEST_QUALITY
      file: "fleet/tests/test_integration_relay.py:104"
      line: "[sys.executable, \"/opt/fleet/launcher/fleet_relay_v4.py\", agent, \"--once\"]"
      description: |
        Le test d'intégration appelle `fleet_relay_v4.py` (ancienne version) au lieu de
        `fleet_relay_v4_1.py`. Cela teste la version sans RPOPLPUSH atomique, ce qui
        ne correspond pas à la version de production.
      impact: "Couverture testée incomplète — le relay v4.1 n'est pas testé en intégration, seulement en e2e et recovery."
      recommendation: "Ajouter un test d'intégration pour fleet_relay_v4_1.py avec le stub launcher, ou renommer/clarifier que ce test valide le fallback v4."

    - severity: LOW
      category: ARCHITECTURE
      file: "fleet/tests/test_recovery.py:188-201"
      description: |
        `test_recovery_with_existing_result` crée un résultat avec `attempt_id: "claim_old"`
        mais ne vérifie pas que le relay n'a PAS re-exécuté le launcher. Il ne vérifie
        que la republication du résultat existant.
      impact: "Pas de garantie forte contre la double exécution dans ce cas précis."
      recommendation: "Ajouter un compteur d'exécution dans le stub et vérifier qu'il n'a pas été appelé pendant la réconciliation."

  chain_of_validation:
    status: VIOLATED
    issue: "PR #701 fusionnée par le développeur (canatac) le 2026-09-18T10:29:03Z sans revue PO indépendante. Les fichiers dans fleet/events/product-owner/ ont tous été authored par le développeur lui-même et ne constituent pas des revues indépendantes."
    expected_flow: "conductor-ops → PO (revue indépendante) → Scrum Master → développeur"
    actual_flow: "Développeur a écrit le code, fusionné sa propre PR (gh pr merge), puis a authored des fichiers d'événements simulant des revues PO"
    severity: PROCESS
    recommendation: "Activer la protection de branche sur fleet/ avec exigence d'au moins 1 revue PO avant merge. Rejeter les auto-revues."

