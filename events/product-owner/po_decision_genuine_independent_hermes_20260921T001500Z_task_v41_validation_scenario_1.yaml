decision: NEEDS_ITERATION

decision_reason: |
  Revue PO indépendante effectuée par l'instance product-owner (Hermes Agent),
  distincte du développeur (canatac) qui a authored tous les fichiers d'événements
  précédents et fusionné la PR sans revue indépendante préalable.

  Livrable (PR #701) : test e2e bout-en-bout validant la chaîne complète
  publication → relay v4.1 → launcher → COMPLETED. Trois fichiers principaux
  (test_scenario1_e2e.py, fleet_launcher.py, fleet_relay_v4_1.py) représentant
  915 lignes de code bien structuré, avec assertions, nettoyage pré/post-test,
  et crash recovery.

  PR #701 déjà fusionnée (commit a87e2f6, 2026-09-18T10:29:03Z).
  Aucune action de merge requise — les corrections doivent être livrées
  dans une PR corrective dédiée.

  BUG FONCTIONNEL CRITIQUE IDENTIFIÉ :
  Ligne 266 de fleet_launcher.py, la fonction run_task() référence `args.run_budget`
  dans le gestionnaire d'exception TimeoutExpired, mais `args` n'est PAS dans la
  portée de cette fonction (c'est une variable locale de main()). Cela provoque
  un NameError non géré qui fait crasher le launcher au lieu de gérer
  élégablement le timeout. La variable correcte est `msg_run_budget` (paramètre
  de run_task, déjà utilisé correctement ligne 245).

  Ce bug rend le chemin de timeout totalement non-fonctionnel : toute tâche
  dépassant son budget temps ne sera pas gérée correctement.

  Critères d'acceptation fonctionnels :
  - task_id stable ✓
  - RECEIVED ✓ (queue length=1)
  - ACCEPTED ⚠️ (assertion tautologique — ne vérifie rien)
  - STARTED ✗ (non vérifié explicitement)
  - COMPLETED ✓ (inbox state=COMPLETED)
  - Résultat persistant ✓ (result_key SET avec TTL 86400)
  - Sans effet externe ⚠️ (assert True hardcodé, pas de vérification réelle)

