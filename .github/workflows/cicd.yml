# GitHub Actions CI/CD — misfits-web
# Pipeline optimisé: quality (parallel) + Docker build+push+deploy
# Target: 2-3 min total

name: CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "9.15.0"

jobs:
  # ============================================================
  # Quality gates — runs IN PARALLEL with Docker build
  # ============================================================
  quality:
    name: Lint + Typecheck + Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

  # ============================================================
  # Docker build + push — NO pre-build, Dockerfile does it all
  # Runs in parallel with quality (no `needs: quality`)
  # ============================================================
  build-and-push:
    name: Build + Push Docker
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Scaleway Container Registry
        uses: docker/login-action@v3
        with:
          registry: rg.fr-par.scw.cloud
          username: nologin
          password: ${{ secrets.SCW_SECRET_KEY }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.SCW_REGISTRY_ENDPOINT }}/misfits-web:latest
            ${{ secrets.SCW_REGISTRY_ENDPOINT }}/misfits-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================
  # Deploy to VM via SSH — after Docker push only
  # ============================================================
  deploy:
    name: Deploy to VM
    needs: build-and-push
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: 22
          script: |
            cd ${{ secrets.VM_DEPLOY_DIR }}
            docker compose -f docker-compose.deploy.yml --env-file .env.deploy pull misfits-web
            docker compose -f docker-compose.deploy.yml --env-file .env.deploy up -d misfits-web
            docker image prune -f || true
            echo "Deploy complete: misfits-web updated on ${{ secrets.VM_HOST }}"
