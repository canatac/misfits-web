# GitHub Actions CI/CD — misfits-web
# Pipeline optimisé: quality (parallel) + Docker build+push+deploy
# Target: 2-3 min total

name: CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "9.15.0"

jobs:
  # ============================================================
  # Quality gates — runs IN PARALLEL with Docker build
  # ============================================================
  quality:
    name: Lint + Typecheck + Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Lint
        run: pnpm exec next lint --max-warnings=0

      - name: Typecheck
        run: pnpm typecheck

      - name: Architecture guard (layer boundaries)
        run: node scripts/arch_guard.mjs

      - name: LOC guard (max 300 lignes/fichier)
        run: node scripts/loc_guard.mjs

      - name: Dependency-cruiser (cycles/orphelins)
        run: npx depcruise src --config .dependency-cruiser.cjs

      - name: Unit tests
        run: pnpm test

  # ============================================================
  # Docker build + push — NO pre-build, Dockerfile does it all
  # Runs in parallel with quality (no `needs: quality`)
  # ============================================================
  build-and-push:
    name: Build + Push Docker
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Scaleway Container Registry
        uses: docker/login-action@v3
        with:
          registry: rg.fr-par.scw.cloud
          username: nologin
          password: ${{ secrets.SCW_SECRET_KEY }}

      - name: Resolve build labels
        id: labels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          WEB_SHA="${GITHUB_SHA}"
          BACKEND_SHA=""
          API_URL="https://api.github.com/repos/canatac/reimagined-guide/actions/runs?branch=master&status=success&event=push&per_page=1"

          if RESPONSE_JSON="$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$API_URL")"; then
            BACKEND_SHA="$(printf '%s' "$RESPONSE_JSON" | python3 -c 'import json,sys; s=sys.stdin.read().strip(); d=json.loads(s) if s else {}; runs=d.get("workflow_runs") or []; print((runs[0].get("head_sha", "")) if runs else "")' 2>/dev/null || true)"
          fi

          : "${WEB_SHA:=unknown}"
          : "${BACKEND_SHA:=unknown}"

          echo "web_sha=${WEB_SHA}" >> "$GITHUB_OUTPUT"
          echo "backend_sha=${BACKEND_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.SCW_REGISTRY_ENDPOINT }}/misfits-web:latest
            ${{ secrets.SCW_REGISTRY_ENDPOINT }}/misfits-web:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_MISFITS_WEB_BUILD_VERSION=misfits-web@${{ steps.labels.outputs.web_sha }}
            NEXT_PUBLIC_REIMAGINED_GUIDE_BUILD_VERSION=reimagined-guide@${{ steps.labels.outputs.backend_sha }}
          cache-from: type=gha,scope=build-${{ github.sha }}
          cache-to: type=gha,scope=build-${{ github.sha }},mode=max

  # ============================================================
  # Deploy to VM via SSH — after Docker push only
  # ============================================================
  deploy:
    name: Deploy to VM
    needs: build-and-push
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Resolve footer build labels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          WEB_SHA="${GITHUB_SHA}"
          echo "MISFITS_WEB_IMAGE_TAG=${WEB_SHA}" >> "$GITHUB_ENV"
          echo "MISFITS_WEB_BUILD_VERSION=misfits-web@${WEB_SHA}" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_MISFITS_WEB_BUILD_VERSION=misfits-web@${WEB_SHA}" >> "$GITHUB_ENV"

          BACKEND_SHA=""
          API_URL="https://api.github.com/repos/canatac/reimagined-guide/actions/runs?branch=master&status=success&event=push&per_page=1"

          if RESPONSE_JSON="$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$API_URL")"; then
            BACKEND_SHA="$(printf '%s' "$RESPONSE_JSON" | python3 -c 'import json,sys; s=sys.stdin.read().strip(); d=json.loads(s) if s else {}; runs=d.get("workflow_runs") or []; print((runs[0].get("head_sha", "")) if runs else "")' 2>/dev/null || true)"
          else
            echo "WARN: unable to fetch backend workflow_runs (rate limit/permissions/network). Using fallback label." >&2
          fi

          if [ -n "$BACKEND_SHA" ]; then
            BACKEND_LABEL="reimagined-guide@${BACKEND_SHA}"
          else
            BACKEND_LABEL="reimagined-guide@unknown"
          fi

          echo "REIMAGINED_GUIDE_BUILD_VERSION=${BACKEND_LABEL}" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_REIMAGINED_GUIDE_BUILD_VERSION=${BACKEND_LABEL}" >> "$GITHUB_ENV"

      - name: Deploy Caddyfile to VM (fixes #730, #436 — auth bypass via proxy)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            set -euo pipefail
            # Pull latest Caddyfile from GitHub raw at this commit, validate, deploy
            curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/Caddyfile" -o /tmp/Caddyfile
            caddy validate --config /tmp/Caddyfile
            # Caddy container mounts ./Caddyfile relative to docker-compose.deploy.yml (at VM_DEPLOY_DIR root)
            # MUST copy to deploy dir root — rg-backend/ subdir does not exist on VM (fixes #810)
            mkdir -p ${{ secrets.VM_DEPLOY_DIR }} && cp /tmp/Caddyfile ${{ secrets.VM_DEPLOY_DIR }}/Caddyfile
            rm -f /tmp/Caddyfile
            # Caddy runs in docker — restart container to pick up new config
            cd ${{ secrets.VM_DEPLOY_DIR }} && docker compose -f docker-compose.deploy.yml restart caddy
            # Ensure Caddy reloads the new config (caddy_config volume may cache old JSON)
            sleep 3 && docker exec caddy caddy reload --config /etc/caddy/Caddyfile 2>/dev/null || true
            echo "Caddyfile deployed to VM root, Caddy container restarted and reloaded."

      - name: Deploy web container via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          MISFITS_WEB_IMAGE_TAG: ${{ env.MISFITS_WEB_IMAGE_TAG }}
          MISFITS_WEB_BUILD_VERSION: ${{ env.MISFITS_WEB_BUILD_VERSION }}
          REIMAGINED_GUIDE_BUILD_VERSION: ${{ env.REIMAGINED_GUIDE_BUILD_VERSION }}
          NEXT_PUBLIC_MISFITS_WEB_BUILD_VERSION: ${{ env.NEXT_PUBLIC_MISFITS_WEB_BUILD_VERSION }}
          NEXT_PUBLIC_REIMAGINED_GUIDE_BUILD_VERSION: ${{ env.NEXT_PUBLIC_REIMAGINED_GUIDE_BUILD_VERSION }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: 22
          envs: MISFITS_WEB_IMAGE_TAG,MISFITS_WEB_BUILD_VERSION,REIMAGINED_GUIDE_BUILD_VERSION,NEXT_PUBLIC_MISFITS_WEB_BUILD_VERSION,NEXT_PUBLIC_REIMAGINED_GUIDE_BUILD_VERSION
          script: |
            set -euo pipefail
            cd ${{ secrets.VM_DEPLOY_DIR }}
            MISFITS_WEB_IMAGE_TAG="$MISFITS_WEB_IMAGE_TAG" docker compose -f docker-compose.web.yml pull web
            docker rm -f misfits-web || true
            MISFITS_WEB_IMAGE_TAG="$MISFITS_WEB_IMAGE_TAG" \
            MISFITS_WEB_BUILD_VERSION="$MISFITS_WEB_BUILD_VERSION" \
            REIMAGINED_GUIDE_BUILD_VERSION="$REIMAGINED_GUIDE_BUILD_VERSION" \
            NEXT_PUBLIC_MISFITS_WEB_BUILD_VERSION="$NEXT_PUBLIC_MISFITS_WEB_BUILD_VERSION" \
            NEXT_PUBLIC_REIMAGINED_GUIDE_BUILD_VERSION="$NEXT_PUBLIC_REIMAGINED_GUIDE_BUILD_VERSION" \
            docker compose -f docker-compose.web.yml up -d web
            docker image prune -f || true
            echo "Deploy complete: misfits-web updated on ${{ secrets.VM_HOST }}"

      - name: Verify deployed web commit label
        env:
          EXPECTED_WEB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          echo "Expected web sha: ${EXPECTED_WEB_SHA}"

          ATTEMPTS=20
          SLEEP_SECONDS=3
          OK=0

          for i in $(seq 1 "$ATTEMPTS"); do
            JSON="$(curl -fsSL --retry 2 --retry-delay 1 --retry-connrefused https://mail.misfits.ai/build-meta || true)"
            if [ -n "$JSON" ]; then
              WEB_LABEL="$(printf '%s' "$JSON" | python3 -c 'import json,sys; data=json.loads(sys.stdin.read()); print(str(data.get("webLabel", "")))' 2>/dev/null || true)"
              echo "Attempt ${i}: webLabel=${WEB_LABEL}"
              if [ "$WEB_LABEL" = "misfits-web@${EXPECTED_WEB_SHA}" ]; then
                OK=1
                break
              fi
            else
              echo "Attempt ${i}: build-meta unreachable"
            fi
            sleep "$SLEEP_SECONDS"
          done

          if [ "$OK" -ne 1 ]; then
            echo "ERROR: footer web commit label mismatch after deploy (expected misfits-web@${EXPECTED_WEB_SHA})." >&2
            exit 1
          fi

      - name: Verify auth bypass fix (closes #730, #436)
        run: |
          set -euo pipefail
          echo "Verifying /api/emails returns 401 without auth..."
          ATTEMPTS=10
          SLEEP_SECONDS=3
          OK=0
          for i in $(seq 1 "$ATTEMPTS"); do
            HTTP_CODE="$(curl -s -o /dev/null -w '%{http_code}' https://mail.misfits.ai/api/emails || true)"
            echo "Attempt ${i}: /api/emails → ${HTTP_CODE}"
            if [ "$HTTP_CODE" = "401" ] || [ "$HTTP_CODE" = "307" ]; then
              OK=1
              break
            fi
            sleep "$SLEEP_SECONDS"
          done
          if [ "$OK" -ne 1 ]; then
            echo "ERROR: /api/emails still returns ${HTTP_CODE} (expected 401 or 307). Auth bypass still active." >&2
            exit 1
          fi
          echo "PASS: /api/emails correctly returns ${HTTP_CODE} (auth enforced)"

      - name: Verify /api/compose/send route registered (closes #818)
        run: |
          set -euo pipefail
          echo "Verifying /api/compose/send is registered (not 404)..."
          ATTEMPTS=20
          SLEEP_SECONDS=3
          OK=0
          for i in $(seq 1 "$ATTEMPTS"); do
            HTTP_CODE="$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{}' https://mail.misfits.ai/api/compose/send || true)"
            echo "Attempt ${i}: POST /api/compose/send → ${HTTP_CODE}"
            if [ "$HTTP_CODE" != "404" ]; then
              OK=1
              break
            fi
            sleep "$SLEEP_SECONDS"
          done
          if [ "$OK" -ne 1 ]; then
            echo "ERROR: /api/compose/send still returns 404 — route not registered in production (stale Docker cache)." >&2
            exit 1
          fi
          echo "PASS: /api/compose/send returns ${HTTP_CODE} (route registered)"

      - name: Verify /api/health route registered (closes #887)
        run: |
          set -euo pipefail
          echo "Verifying /api/health is registered (not 404)..."
          ATTEMPTS=20
          SLEEP_SECONDS=3
          OK=0
          for i in $(seq 1 "$ATTEMPTS"); do
            HTTP_CODE="$(curl -s -o /dev/null -w '%{http_code}' https://mail.misfits.ai/api/health || true)"
            echo "Attempt ${i}: GET /api/health → ${HTTP_CODE}"
            if [ "$HTTP_CODE" != "404" ]; then
              OK=1
              break
            fi
            sleep "$SLEEP_SECONDS"
          done
          if [ "$OK" -ne 1 ]; then
            echo "ERROR: /api/health still returns 404 — route not registered (rewrite exclusion missing)." >&2
            exit 1
          fi
          echo "PASS: /api/health returns ${HTTP_CODE} (route registered)"
